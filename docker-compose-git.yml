
x-spyne-git-repo:
  &spyne-git-repo 
  https://github.com/CDCgov/spyne.git#v2.1.0

x-base-image:
  &base-image
  base_image: debian:bookworm

x-python-version:
  &python-version
  python_version: python3.10

x-irma-image:
  &irma-image
  irma_image: cdcgov/irma:v1.2.0

x-dais-image:
  &dais-image
  dais_image: cdcgov/dais-ribosome:v1.5.4

x-data-volume:
  &data-volume
  type: bind
  source: /home/snu3/Github/FLU_SC2_SEQUENCING
  target: /data

services:
  spyne: 
    container_name: spyne
    image: spyne:latest
    build:
      context: *spyne-git-repo
      dockerfile: Dockerfile
      args:
        << : [*base-image, *python-version, *irma-image, *dais-image]
    restart: always
    volumes:
      - *data-volume
    command: tail -f /dev/null

